name: 'CodeQL Analysis'
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday 4am UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'go']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum

      - name: Build Go
        if: matrix.language == 'go'
        run: cd dashboard && go build ./...

      - name: Autobuild
        if: matrix.language != 'go'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # Code Scanning requires GitHub Advanced Security on private repos,
          # which isn't enabled here. The analysis still runs locally (and
          # surfaces findings in the workflow log) — we just skip the
          # upload-to-Code-Scanning step that would otherwise fail with
          # "Code scanning is not enabled for this repository."
          # If GHAS is enabled later (or the repo goes public), flip
          # upload back to true (the default) to get the Security tab UI.
          upload: false
