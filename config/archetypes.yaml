# archetypes.yaml — 5 role archetypes with scoring lenses.
#
# Loaded by scripts/lib/archetype-config.mjs and consumed by the classifier
# (G3) and the additive scoring layer (G4).
#
# Notes:
#   - `reward_signals` only — no penalty keywords. Surviving Web3 companies
#     with active hiring are self-selecting for quality, so the institutional-
#     companies boost + relevant role+function tags do the work.
#   - `inherit_from: <archetype-id>` resolves to the same section of the named
#     archetype at load time.
#   - Hard floors (location, comp, blocked industries) live in
#     `global_disqualifiers`.

archetypes:
  - id: gtm-engineering
    name: GTM Engineer
    description: Engineer who builds GTM infrastructure — outbound systems, signal engines, CRM intelligence
    maturity: primary
    resume: autoapply/resumes/parsed/gtm-engineering.html
    required_signals:
      - technical_role
      - gtm_context
    reward_signals:
      - keywords: [Python, SQL, Clay, HubSpot, Salesforce, signal, outbound, attribution, enrichment, scoring]
        weight: 5
      - keywords: [Claude API, GPT, LLM, AI-native, agent, AI-first]
        weight: 7
      - keywords: [Series A, Series B, Series C, growth-stage]
        weight: 3
      - keywords: [GTM Engineer, Revenue Engineer, Forward Deployed]
        weight: 15
    title_signals:
      high_match: ["GTM Engineer", "Revenue Engineer", "Forward Deployed Engineer", "Revenue Architect"]
      medium_match: ["Sales Engineer", "RevOps Engineer", "Growth Engineer", "Solutions Engineer"]
      low_match: ["Senior AE", "Sales Operations Manager"]

  - id: ai-operations
    name: AI Operations
    description: Operator who builds AI-native systems for revenue, operations, and customer-facing teams
    maturity: primary
    resume: autoapply/resumes/parsed/ai-operations.html
    required_signals:
      - ai_native_org
      - operations_or_revenue_context
    reward_signals:
      - keywords: [LLM, Claude, GPT, agent, agentic, AI-native, AI-first, automation, autonomous]
        weight: 8
      - keywords: [operations, RevOps, BizOps, Head of AI, AI Lead]
        weight: 6
      - keywords: [Python, automation framework, workflow orchestration, n8n, Zapier]
        weight: 4
    title_signals:
      high_match: ["AI Operations Lead", "Head of AI", "AI Ops Engineer", "Applied AI Engineer"]
      medium_match: ["BizOps Manager", "Operations Manager", "Director of Operations"]
      low_match: ["Generic Operations Manager"]

  - id: fde
    name: Forward Deployed Engineer
    description: Engineer embedded with customers to deploy and customize products — full-stack engineering for production deployments, AI/ML integration, and customer-facing implementation. High title variance (FDE / Applied AI Engineer / Deployment Strategist / Customer Engineer); see audit 2026-05-28-fde-sourcing for the empirical title + JD-keyword study.
    maturity: primary
    resume: autoapply/resumes/parsed/fde.html
    required_signals:
      - technical_role
      - customer_facing
    reward_signals:
      # High-signal title-stem keywords that appear in the role name itself.
      - keywords:
          - Forward Deployed
          - FDE
          - Applied AI Engineer
          - Customer Engineer
          - Field Engineer
          - Deployment Strategist
          - Deployment Engineer
          - Implementation Engineer
        weight: 20
      # Empirical JD theme keywords. Derived from bloomberry's analysis of 1K
      # FDE postings (2026-05): "work directly with customers" appears in 55%,
      # "build and deploy AI/ML systems" in 37%, "integrate systems/APIs" in 32%.
      # Bare "deployment" / "deploy" kept alongside more-specific phrases because
      # they're the simplest FDE-signal-words in any role description; precision
      # is preserved by the required_signals gate (technical_role + customer_facing).
      - keywords:
          - deployment
          - deploy
          - work directly with customers
          - customer-facing engineering
          - embedded with the customer
          - production deployment
          - production engineering
          - deployment playbook
          - customization
          - integration
        weight: 8
      # AI/ML deployment context — distinguishes modern AI-era FDE from the
      # classic Palantir-style data-engineering FDE. Source: bloomberry +
      # fwddeploy.com listings; "Applied AI" is Anthropic's framing.
      - keywords:
          - prompt engineering
          - LLM evaluation
          - agent deployment
          - MCP server
          - production LLM
          - AI/ML system deployment
        weight: 6
      # Canonical FDE-employer markers. When a JD names these as customer,
      # competitor, or peer context, the role is more likely FDE-archetype.
      # Expanded with fdepulse.com + bloomberry empirical top-employers (2026-05).
      - keywords:
          - Palantir
          - Foundry
          - Hebbia
          - Glean
          - Decagon
          - Sierra
          - Anthropic
          - Anyscale
          - Databricks
          - Reducto
          - Intercom
          - ConductorOne
          - Vanta
        weight: 6
    title_signals:
      # Canonical FDE titles + empirical variants from the fwddeploy.com job
      # board (2026-05). Substring matched, so Senior/Lead/Principal/Staff
      # prefixes are caught automatically.
      high_match:
        - Forward Deployed Engineer
        - Forward Deployed AI Engineer
        - Forward Deployed Software Engineer
        - Forward Deployed Data Engineer
        - Forward Deployed Data Solution Engineer
        - Forward Deployed Security Engineer
        - Forward Deployed Engineering Manager
        - Applied AI Engineer
        - Field Engineer
        - Customer Engineer
      # Medium-match: ambiguous titles. Per the existing system design
      # (archetype-classifier.mjs:120-180), these only cross confidence
      # threshold when JD body fires the FDE reward_signals above — handles
      # the high-variance role-spec problem (e.g., Deployment Strategist
      # can mean FDE OR consultant; body keywords disambiguate).
      medium_match:
        - Deployment Strategist
        - Implementation Engineer
        - Deployment Engineer
        - Solutions Engineer
        - Solutions Architect
        - Technical Consultant
        - Forward Deployed AI Consultant
        - Forward Deployed Creative Technologist
      low_match: ["Generic Software Engineer"]

  - id: web3-bd
    name: Web3 BD
    description: BD/Partnerships at institutional-grade Web3 companies
    maturity: fallback
    resume: autoapply/resumes/parsed/web3-bd.html
    required_signals:
      - web3_context
      - bd_or_partnerships_role
    reward_signals:
      - keywords: [BD, Business Development, Partnerships, Strategic Partnerships, Enterprise]
        weight: 8
      - keywords: [Head of BD, VP BD, Director of Partnerships]
        weight: 10
      - keywords: [institutional, enterprise, regulated, compliance]
        weight: 6
    institutional_companies_boost:
      # stablecoin_tier: the only Web3 companies the user actually wants the
      # strong boost for — stablecoin issuers + stablecoin custody/infra.
      stablecoin_tier:
        - Paxos
        - Circle
        - BitGo
        - Anchorage Digital
        - Anchorage          # match the short form too
        - Tether
        - Bridge.xyz
        - Brale
      # tier_1: institutional but NOT stablecoin-adjacent — small bump only.
      tier_1:
        - Turnkey
        - Securitize
        - Fireblocks
        - Chainalysis
        - Coinbase Institutional
        - Galaxy Digital
        - Talos
        - Copper
        - Hex Trust
      # tier_2: DeFi protocols — minimal bump.
      tier_2:
        - Uniswap Labs
        - Aave Companies
        - Compound Labs
        - 1inch
        - Curve
        - Lido
        - Frax Finance
        - Morpho
        - Pendle
        - Maker DAO
    title_signals:
      high_match: ["Head of BD", "VP BD", "Head of Partnerships", "Director of Strategic Partnerships"]
      medium_match: ["BD Manager", "Partnerships Lead", "Strategic Partnerships"]

  - id: web3-bizops
    name: Web3 BizOps
    description: Operations/Strategy at institutional-grade Web3 companies
    maturity: fallback
    resume: autoapply/resumes/parsed/web3-bizops.html
    required_signals:
      - web3_context
      - operations_role
    reward_signals:
      - keywords: [tokenomics, treasury, capital strategy, fundraising, exchange listing]
        weight: 8
      - keywords: [BizOps, Chief of Staff, Head of Strategy, Strategic Finance]
        weight: 10
      - keywords: [vendor evaluation, regulatory, compliance, legal coordination]
        weight: 6
    institutional_companies_boost:
      inherit_from: web3-bd
    title_signals:
      high_match: ["Chief of Staff", "Head of BizOps", "Head of Strategy", "VP Operations"]
      medium_match: ["BizOps Manager", "Strategy Manager"]

global_disqualifiers:
  location:
    - "fully on-site SF"
    - "fully on-site LA"
    - "fully on-site Seattle"
    - "fully on-site Austin"
    - "fully on-site Chicago"
  industries_blocked: [gambling, weapons, predatory-lending, mlm, tobacco, vape]
