# user-context.example.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Copy this file to config/user-context.yaml and fill in YOUR personal scoring
# biases. This is the per-user calibration file consumed by
# scripts/lib/scoring-layer.mjs at scoring time. All values are point deltas
# applied on top of the 0-100 fit-score scale (fit_score is 0-10 from the
# enricher; the scoring layer multiplies by 10 internally).
#
# Companion files:
#   config/profile.example.yml      — your identity / target roles / narrative
#   config/archetypes.yaml          — the universal archetype catalog (don't
#                                      modify per-user; modify user-context
#                                      instead)
#
# What goes WHERE (productization boundary):
#   - "I'm a senior backend engineer with 5 years"      → here (qualifications)
#   - "I won't relocate to SF"                          → here (location_preferences)
#   - "Don't show me gambling industry roles"           → here (hard_nos)
#   - "Forward Deployed Engineer is a role I qualify for" → here (archetype_fit)
#   - "What does an FDE role look like?"                → archetypes.yaml (catalog)
#   - "What's my name?"                                 → config/profile.yml

# ── Location preferences ────────────────────────────────────────────────────
# Point deltas applied based on role.location_workplace + city. Mapped from
# the structured location classifier in scripts/lib/location.mjs.
# Negative values penalize; positive values reward.
location_preferences:
  fully_remote: +5
  hybrid_nyc: +10
  hybrid_nyc_area: +8                  # Brooklyn, Jersey City, Long Island City, Hoboken
  hybrid_sf: -40
  hybrid_la: -40
  hybrid_chicago: -30
  hybrid_other_us: -25
  hybrid_international: -50
  onsite_nyc: 0                         # OK if comp is right
  onsite_other_us: -60
  onsite_international: -75

# ── Compensation gates ──────────────────────────────────────────────────────
# floor_usd is the absolute minimum total comp (base + bonus) you'll consider.
# Roles whose mid-point is below the floor get hit with below_floor_penalty.
# Roles with no comp data listed get a small no_comp_listed ding (configurable
# because "no comp listed" can mean "junior public posting" OR "high-paying
# senior role that doesn't publish comp" depending on the company).
compensation:
  floor_usd: 200000
  target_usd: 240000
  below_floor_penalty: -50
  no_comp_listed: -5

# ── Hard nos ────────────────────────────────────────────────────────────────
# Anything matching here returns score=0 + disqualified=true. Two categories:
#   industries        — substring match against the role's industry tags
#   company_signals   — pattern match against company news in the JD text
hard_nos:
  industries:
    - consumer-only
    - gambling
    - weapons
    - predatory-lending
    - mlm
    - vape
    - tobacco
  company_signals:
    - layoffs-announced-30d
    - ceo-fired-30d
    - sec-investigation
    - lawsuit-pending

# ── Soft preferences (small uplifts) ────────────────────────────────────────
# Pattern-match against company descriptions. Detected from JD text mentions
# (e.g., "a16z-backed", "Y Combinator alumnus").
soft_preferences:
  a16z_portfolio: +5
  paradigm_portfolio: +3
  yc_alum: +3
  ex_founder_team: +3
  diverse_leadership: +2

# ── Anti-signals (small dings) ──────────────────────────────────────────────
# Pattern-match against company news / funding history.
anti_signals:
  acqui_hire_in_last_18_months: -10
  five_plus_rounds_in_18_months: -10

# ── Per-archetype qualification gate (v2 productization, shipped v1.9.0) ────
# Optional. If absent, no gate is applied (backward-compat default).
# When present, the scoring layer:
#   - if qualified=false  → zeroes the archetype-lens contribution
#                            (the user should not see this archetype's roles
#                            uplifted at all)
#   - if confidence_floor → trims the lens contribution to 0 when the
#                            classifier's confidence on the role is below
#                            the floor for this user
#
# Use confidence_floor for "I could do this but it's not my primary" cases.
# Use qualified=false for "I am not a fit for this archetype, period" cases.
#
# Each archetype id MUST match an id in config/archetypes.yaml.
# See docs/audits/2026-05-28-fde-sourcing-audit.md for the design rationale.
archetype_fit:
  # Primary targets — low confidence_floor (you want to see borderline matches).
  fde:
    qualified: true
    confidence_floor: 0.5
  gtm-engineering:
    qualified: true
    confidence_floor: 0.4
  ai-operations:
    qualified: true
    confidence_floor: 0.5
  # Fallback archetypes — high confidence_floor (only count strong matches).
  web3-bd:
    qualified: true
    confidence_floor: 0.7
  web3-bizops:
    qualified: true
    confidence_floor: 0.7

# ── Agent / assistant configuration ─────────────────────────────────────────
# Per-user agent settings read at chat-request time by
# dashboard-web/app/api/chat/route.ts.
#
#   voice   — LIVE. Selects the system-prompt persona for the chat agent.
#             "direct"      → concrete, candid, pushes back when the user's
#                              read doesn't match the data (default; Nick's
#                              prior hard-coded voice).
#             "warm"        → encouraging, soft-pedals critique with empathy.
#             "analytical"  → data-first; leads with scores, counts, ranges.
#             "custom:<text>" → escape hatch — uses <text> verbatim as the
#                              persona instruction.
#
#   redact  — LIVE. List of fields to strip from the CV before sending it
#             to the LLM. Each entry maps to one or more line-level regex
#             strips that replace matched substrings with [REDACTED].
#             Supported entries: email, phone, address, zip, linkedin,
#             portfolio_url, salary_history. Unknown entries are silently
#             ignored (forward-compat).
#
#   tools   — LIVE (Step 9 close, shipped in Step 8 PR c). Per-tool
#             authorization. Read at chat-request time by loadAgentConfig
#             in dashboard-web/app/api/chat/route.ts and applied per round
#             by runAgentLoop's effectiveToolPolicy().
#             Policies:
#               "auto"    → run without asking. Mutating tools still go
#                           through the same executeMutatingTool path
#                           (atomic writes + confirmed_bulk at the HTTP
#                           layer); the chat UI just skips the confirm
#                           card. Use for tools you trust enough to fire-
#                           and-forget — common for regenerate_briefing
#                           in a daily-driver workflow.
#               "confirm" → show the confirmation card with preview + ✓/✗.
#                           Default for mutating tools when unset.
#               "deny"    → the agent can't call this tool at all; it
#                           receives a synthetic refusal tool_result and
#                           apologizes / proposes an alternative. Useful
#                           for a productization where, say, the deployed
#                           instance shouldn't ever auto-mark roles.
#             Defaults for missing keys:
#               read tools     → "auto"
#               mutating tools → "confirm"
agent:
  voice: direct                         # direct | warm | analytical | custom:<prompt>
  redact: []                            # e.g. [address, phone, salary_history]
  tools:
    # Read-only tools — generally safe to auto-execute
    query_roles: auto
    read_prep_doc: auto
    # Mutating tools (Step 7) — confirm by default. Flip to "auto" once you
    # trust the agent to make these edits without your gating click.
    update_application_status: confirm
    update_score_override: confirm
    update_user_context: confirm
    # Triggered actions (Step 8) — confirm by default. regenerate_briefing
    # is the most common candidate to flip to "auto" — it's the morning-
    # routine action with a clear 30s progress widget, no data risk.
    regenerate_briefing: confirm
    trigger_scan: confirm
    trigger_signal_scan: confirm
    # Cancellation (Step 8 follow-up) — flip to "auto" if you want fast
    # "stop the scan" via voice with no card click. Safe to auto since
    # cancellation is restorative (less harmful than the original mutation).
    cancel_scan: confirm

# ── Scheduled tasks (cron opt-ins) ──────────────────────────────────────────
# Controls what the cron wrapper (scripts/run-scan.sh) is allowed to run
# beyond the scans themselves. Everything here defaults to FALSE — these are
# paid LLM calls, so cron never triggers one you didn't explicitly enable.
#
#   regenerate_briefing — regenerate the morning briefing after the scan
#       completes (one Claude call, roughly $0.20/run; the cron wrapper only
#       attempts it before noon, so worst case is one regen per day). The
#       dashboard "regenerate" button and the chat agent's regenerate_briefing
#       tool are NOT affected by this setting — it gates cron only.
scheduled_tasks:
  regenerate_briefing: false
