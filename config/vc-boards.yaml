# VC portfolio job boards — declarative reconnaissance.
#
# Built during Task F (2026-05-14 12h session). The spec assumed Getro was the
# dominant VC-board platform; live probing showed Consider.com is more common,
# with Getro a minority. Wellfound (formerly AngelList) is DataDome-protected
# — plain HTTP GETs return 403 even with a real browser UA. Direct crawling of
# these boards needs either platform-specific reverse-engineering (Consider's
# XHR endpoints) or rendered-DOM scraping via browser-harness. Neither was in
# scope for the 12-hour window after Wellfound blocked and Consider boards
# turned out to be SPAs.
#
# Today: Tier 11 (scripts/scan-jobs.mjs ~line 1477) already crawls these
# boards via Exa keyword queries — uses Exa tokens but works and surfaces
# ATS-linked roles for auto-promotion. This file is the inventory for the
# follow-up DIRECT crawler.
#
# Schema:
#   - name              human-readable VC name (used in console output)
#   - url               canonical board URL
#   - platform          one of [consider, getro, custom, unknown, blocked]
#   - status            one of [working, blocked, needs_implementation]
#   - relevance         high | medium | low — driven by Linera-stage fit
#   - notes             freeform; cite the probe date for any reachability claim

boards:
  - name: a16z
    url: https://portfoliojobs.a16z.com
    platform: consider
    status: needs_implementation
    relevance: high
    notes: |
      Linera is a16z-backed. Page renders 765 companies / 15,421 jobs.
      Server-side HTML is a Consider.com skeleton; the per-job data loads via
      XHR after hydration. Reverse-engineering Consider's data endpoint or
      using browser-harness to extract from the rendered DOM is the path
      forward. Reachable HTTP 200 (probed 2026-05-14).

  - name: Sequoia
    url: https://jobs.sequoiacap.com
    platform: consider
    status: needs_implementation
    relevance: medium
    notes: |
      Same Consider.com platform as a16z. 20KB skeleton, content via XHR.
      Reachable HTTP 200 (probed 2026-05-14).

  - name: Bain Capital Ventures
    url: https://jobs.bcv.com
    platform: consider
    status: needs_implementation
    relevance: medium
    notes: |
      Consider.com skeleton, 20KB. Probed 2026-05-14.

  - name: Foundation Capital
    url: https://jobs.foundationcapital.com
    platform: getro
    status: needs_implementation
    relevance: medium
    notes: |
      Confirmed Getro-hosted (126KB page contains 'getro' references). A
      generic Getro scraper built here would also fit other Getro-hosted
      boards (write the extractor, find more Getro hosts later).

  - name: Greylock
    url: https://jobs.greylock.com
    platform: consider
    status: needs_implementation
    relevance: medium
    notes: |
      Consider.com skeleton. Reachable HTTP 200 (probed 2026-05-14). Note:
      the legacy 'greylockcareers.com' DNS no longer resolves; this is the
      canonical URL now.

  - name: Bessemer Venture Partners
    url: https://www.bvp.com/portfolio/jobs
    platform: custom
    status: needs_implementation
    relevance: medium
    notes: |
      1.4MB page, no Consider/Getro signature. Likely custom React app with
      its own data fetching. Lowest-priority — needs platform-specific
      scraping.

  - name: Wellfound (formerly AngelList Talent)
    url: https://wellfound.com/jobs
    platform: blocked
    status: blocked
    relevance: high
    notes: |
      DataDome-protected. Plain HTTP GET returns HTTP 403 even with a
      browser User-Agent. Probed 2026-05-14; same status as
      autoapply/SCRAPER_AUDIT.md observed historically. Direct crawling
      requires either:
        (a) browser-harness with stealth + cookies (interactive setup), or
        (b) a paid scraping proxy (Bright Data / ScraperAPI),
      neither of which fit the 12h-session no-new-deps constraint. Skipping
      for now — most Wellfound roles eventually surface through BuiltIn
      (Tier 9) or the ATS APIs once Task A's enrich-time auto-promotion
      kicks in. Re-evaluate if BuiltIn declines.
